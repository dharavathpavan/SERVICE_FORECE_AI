include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Keep the design system disciplined: unused elements are errors, not hints.
    unused_element: warning
    unused_import: error
    dead_code: error
  exclude:
    - build/**
    - web/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - sort_child_properties_last
    - use_super_parameters
    # `require_trailing_commas` is intentionally NOT enabled: it contradicts the
    # Dart 3.7+ "tall style" formatter, which decides comma placement itself and
    # removes the commas the lint then demands back. `dart format .` is the
    # authority on layout in this project.
