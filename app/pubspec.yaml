name: serviceforce
description: ServiceForce.ai — multi-tenant AI voice agent platform with physical-SIM telephony.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  intl: ^0.19.0
  web_socket_channel: ^2.4.5
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.0.3
  # Material's iOS text-selection controls reference CupertinoIcons; without this
  # package the icon tree-shaker warns and the glyphs are missing on iOS.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
