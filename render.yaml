# Render Blueprint for ServiceForce.ai
#
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
# Render will create the database, Redis, backend web service and static site.
#
# Notes:
#   * The backend runs its task runner in "inline" mode by default, so no
#     separate Celery worker is required for a basic deploy.
#   * The Flutter web build needs the Flutter SDK, which the static-site build
#     command installs into /tmp (slow on first build; cached by Render between
#     deploys is NOT guaranteed, so expect a few minutes per build).
#   * Set GEMINI_API_KEY (and any other provider keys) in the dashboard; they are
#     never baked into the frontend bundle.

databases:
  - name: serviceforce-db
    databaseName: serviceforce
    user: serviceforce
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: serviceforce-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: serviceforce-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/storage
      - key: VOICE_PROVIDER
        value: mock
      - key: TELEPHONY_PROVIDER
        value: mock
      - key: WORKER_MODE
        value: inline
      - key: BACKEND_CORS_ORIGINS
        value: '["https://serviceforce-web.onrender.com"]'
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: ^https://.*\.onrender\.com$
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash-exp
    disk:
      name: serviceforce-storage
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: serviceforce-web
    runtime: static
    buildCommand: |
      set -e
      if [ ! -d /tmp/flutter ]; then
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 /tmp/flutter
      fi
      export PATH="/tmp/flutter/bin:$PATH"
      flutter --version
      cd app
      flutter pub get
      flutter build web --release --dart-define=API_BASE_URL=https://serviceforce-api.onrender.com/api/v1
    staticPublishPath: app/build/web
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
